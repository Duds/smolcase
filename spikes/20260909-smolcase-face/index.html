<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMOLCASE Face Sphere Spike</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; min-height: 100%; background: #000; color: #c7d2dc; font: 14px system-ui, sans-serif; }
    body { overflow: hidden; display: grid; place-items: center; }
    #phone-screen {
      position: relative;
      width: min(100vw - 32px, calc((100vh - 32px) * 1080 / 2424));
      aspect-ratio: 1080 / 2424;
      overflow: hidden;
      border: 1px solid #34424d;
      border-radius: 28px;
      background: #000;
      box-shadow: 0 0 0 8px #111820, 0 18px 60px #000a;
    }
    #app { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
    #blur-layer {
      position: absolute;
      z-index: 1;
      inset: 0;
      pointer-events: none;
      backdrop-filter: blur(var(--blur-size, 10px));
      -webkit-backdrop-filter: blur(var(--blur-size, 10px));
      background: transparent;
    }
    #dot-matrix-layer {
      position: absolute;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      background: #000;
      /* Black substrate with transparent circular apertures punched through it. */
      -webkit-mask-image: radial-gradient(circle at center, transparent 0 var(--aperture, 31%), #000 var(--aperture, 31%));
      -webkit-mask-size: calc(100% / var(--dot-cols, 38)) calc(100% / var(--dot-rows, 68));
      -webkit-mask-repeat: repeat;
      mask-image: radial-gradient(circle at center, transparent 0 var(--aperture, 31%), #000 var(--aperture, 31%));
      mask-size: calc(100% / var(--dot-cols, 38)) calc(100% / var(--dot-rows, 68));
      mask-repeat: repeat;
    }
    #hud { position: fixed; top: 16px; left: 16px; z-index: 3; max-width: 320px; padding: 12px 14px; border: 1px solid #28323c; background: #0d131aee; }
    #controls { position: fixed; top: 16px; right: 16px; z-index: 3; width: 220px; padding: 12px 14px; border: 1px solid #28323c; background: #0d131aee; }
    #controls strong { display: block; margin-bottom: 8px; color: #f0f5f8; }
    .control { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; margin: 8px 0; }
    .control input { grid-column: 1 / -1; width: 100%; accent-color: #8de8ff; }
    .control output { color: #8de8ff; }
    #hud strong { display: block; margin-bottom: 6px; color: #f0f5f8; }
    #hud p { margin: 4px 0; line-height: 1.4; }
    kbd { padding: 1px 5px; border: 1px solid #46525e; border-radius: 3px; color: #f0f5f8; }
  </style>
</head>
<body>
  <div id="phone-screen" data-screen-resolution="1080x2424">
    <div id="app"></div>
    <div id="blur-layer" aria-hidden="true"></div>
    <div id="dot-matrix-layer" aria-hidden="true"></div>
  </div>
  <div id="controls">
    <strong>Face parameters</strong>
    <label class="control">Blur <output id="blur-value">10px</output><input id="blur" type="range" min="0" max="24" step="1" value="10"></label>
    <label class="control">Blur mode <output id="blur-mode-value">CSS</output><select id="blur-mode"><option value="css" selected>CSS layer</option><option value="fog">3D fog</option></select></label>
    <label class="control">Fog density <output id="fog-density-value">0.23</output><input id="fog-density" type="range" min="0" max="0.8" step="0.01" value="0.23"></label>
    <label class="control">Aperture <output id="aperture-value">31%</output><input id="aperture" type="range" min="10" max="48" step="1" value="31"></label>
    <label class="control">Dot columns <output id="cols-value">38</output><input id="cols" type="range" min="20" max="64" step="1" value="38"></label>
    <label class="control">Dot rows <output id="rows-value">68</output><input id="rows" type="range" min="40" max="100" step="1" value="68"></label>
    <label class="control">Face height <output id="anchor-value">2.80</output><input id="anchor" type="range" min="0" max="4" step="0.05" value="2.8"></label>
    <label class="control">Yaw range <output id="yaw-value">50°</output><input id="yaw" type="range" min="0" max="90" step="1" value="50"></label>
    <label class="control">Pitch range <output id="pitch-value">50°</output><input id="pitch" type="range" min="0" max="90" step="1" value="50"></label>
    <label class="control">Eye size <output id="eye-value">0.52</output><input id="eye" type="range" min="0.25" max="0.8" step="0.01" value="0.52"></label>
    <strong>Key light</strong>
    <label class="control">Light X <output id="light-x-value">-4.0</output><input id="light-x" type="range" min="-8" max="8" step="0.1" value="-4"></label>
    <label class="control">Light Y <output id="light-y-value">-3.0</output><input id="light-y" type="range" min="-8" max="8" step="0.1" value="-3"></label>
    <label class="control">Light Z <output id="light-z-value">6.0</output><input id="light-z" type="range" min="1" max="12" step="0.1" value="6"></label>
    <label class="control">Intensity <output id="light-intensity-value">40.0</output><input id="light-intensity" type="range" min="0" max="40" step="1" value="40"></label>
    <strong>Layer visibility</strong>
    <label><input id="show-sphere" type="checkbox" checked> Show source sphere</label>
    <label><input id="show-edges" type="checkbox" checked> Show sphere edges</label>
    <label><input id="show-blur" type="checkbox" checked> Show blur layer</label>
    <label><input id="show-matrix" type="checkbox" checked> Show dot matrix</label>
  </div>
  <div id="hud">
    <strong>SMOLCASE face sphere spike</strong>
    <p>Awake baseline. The sphere is visible because this spike tests the underlying model, not the dot-matrix viewport.</p>
    <p>Move the sphere with the mouse. Use <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> for keyboard control.</p>
    <p id="state">gaze: 0.00, 0.00 | eyes: awake</p>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    const sceneFog = new THREE.FogExp2(0x000000, 0.23);

    // Key light: in front of the face, below and to the left, aimed back at
    // the sphere to test whether directional shading survives the viewport.
    const keyLight = new THREE.PointLight(0xb8e7ff, 18, 20);
    keyLight.position.set(-4, -3, 6);
    scene.add(keyLight);

    const camera = new THREE.OrthographicCamera(-3.2, 3.2, 3.2, -3.2, 0.1, 100);
    camera.position.set(0, 0, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const screen = document.querySelector('#phone-screen');
    const app = document.querySelector('#app');
    app.append(renderer.domElement);

    const face = new THREE.Group();
    scene.add(face);

    const sphereGeometry = new THREE.SphereGeometry(2.4, 48, 32);
    const sphere = new THREE.Mesh(
      sphereGeometry,
      new THREE.MeshStandardMaterial({ color: 0x263a48, roughness: 0.78, metalness: 0.05, transparent: false, opacity: 1 })
    );
    const sphereEdges = new THREE.LineSegments(
      new THREE.WireframeGeometry(sphereGeometry),
      new THREE.LineBasicMaterial({ color: 0x5b7688, opaque: true, transparent: false, opacity: 1 })
    );
    // Nudge the wireframe outward so the lines sit above the sphere surface
    // instead of z-fighting with it.
    sphereEdges.scale.setScalar(1.002);
    face.add(sphere, sphereEdges);

    const parameters = {
      blur: 10,
      aperture: 31,
      cols: 38,
      rows: 68,
      anchor: 2.8,
      yaw: 50,
      pitch: 50,
      eye: 0.52,
      showSphere: true,
      showEdges: true,
      showBlur: true,
      showMatrix: true,
      lightX: -4,
      lightY: -3,
      lightZ: 6,
      lightIntensity: 40,
      blurMode: 'css',
      fogDensity: 0.23
    };
    const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x8de8ff, depthTest: false });
    const eyeGeometry = new THREE.SphereGeometry(parameters.eye, 24, 16);
    const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
    leftEye.position.set(-0.82, 0.55, 2.15);
    rightEye.position.set(0.82, 0.55, 2.15);
    leftEye.renderOrder = 2;
    rightEye.renderOrder = 2;
    face.add(leftEye, rightEye);

    const gaze = { x: 0, y: 0, targetX: 0, targetY: 0 };
    const clock = new THREE.Clock();
    let blink = 0;
    let nextBlink = 2.8;

    const root = document.documentElement;
    const blurLayer = document.querySelector('#blur-layer');
    const matrixLayer = document.querySelector('#dot-matrix-layer');
    const controlNames = ['blur', 'aperture', 'cols', 'rows', 'anchor', 'yaw', 'pitch', 'eye', 'light-x', 'light-y', 'light-z', 'light-intensity', 'fog-density'];

    function applyParameters() {
      root.style.setProperty('--blur-size', `${parameters.blur}px`);
      root.style.setProperty('--aperture', `${parameters.aperture}%`);
      root.style.setProperty('--dot-cols', parameters.cols);
      root.style.setProperty('--dot-rows', parameters.rows);
      keyLight.position.set(parameters.lightX, parameters.lightY, parameters.lightZ);
      keyLight.intensity = parameters.lightIntensity;
      sceneFog.density = parameters.fogDensity;
      scene.fog = parameters.showBlur && parameters.blurMode === 'fog' ? sceneFog : null;
      face.position.y = parameters.anchor;
      face.rotation.y = gaze.x * THREE.MathUtils.degToRad(parameters.yaw);
      face.rotation.x = -gaze.y * THREE.MathUtils.degToRad(parameters.pitch);
      const eyeScale = parameters.eye / 0.52;
      leftEye.scale.setScalar(eyeScale);
      rightEye.scale.setScalar(eyeScale);
      sphere.visible = parameters.showSphere;
      sphereEdges.visible = parameters.showSphere && parameters.showEdges;
      blurLayer.hidden = !parameters.showBlur || parameters.blurMode !== 'css';
      matrixLayer.hidden = !parameters.showMatrix;

      for (const name of controlNames) {
        const output = document.querySelector(`#${name}-value`);
        const parameterName = name.includes('-') ? name.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase()) : name;
        const value = parameters[parameterName];
        output.textContent = name === 'blur' ? `${value}px` : name === 'aperture' ? `${value}%` : name === 'yaw' || name === 'pitch' ? `${value}°` : name.startsWith('light-') ? Number(value).toFixed(1) : name === 'fog-density' ? Number(value).toFixed(2) : Number(value).toFixed(name === 'anchor' || name === 'eye' ? 2 : 0);
      }
      document.querySelector('#blur-mode-value').textContent = parameters.blurMode === 'css' ? 'CSS' : '3D fog';
    }

    for (const name of controlNames) {
      const control = document.querySelector(`#${name}`);
      control.addEventListener('input', (event) => {
        const parameterName = name.includes('-') ? name.replace(/-([a-z])/g, (_, letter) => letter.toUpperCase()) : name;
        parameters[parameterName] = Number(event.target.value);
        applyParameters();
      });
    }

    document.querySelector('#blur-mode').addEventListener('change', (event) => {
      parameters.blurMode = event.target.value;
      applyParameters();
    });

    for (const name of ['showSphere', 'showEdges', 'showBlur', 'showMatrix']) {
      const control = document.querySelector(`#${name.replace('show', 'show-').toLowerCase()}`);
      control.addEventListener('change', (event) => {
        parameters[name] = event.target.checked;
        applyParameters();
      });
    }
    applyParameters();

    function setGaze(x, y) {
      gaze.targetX = THREE.MathUtils.clamp(x, -1, 1);
      gaze.targetY = THREE.MathUtils.clamp(y, -1, 1);
    }

    function pointerGaze(event) {
      // The sphere follows the pointer position within the phone screen.
      const bounds = screen.getBoundingClientRect();
      setGaze(
        ((event.clientX - bounds.left) / bounds.width) * 2 - 1,
        1 - ((event.clientY - bounds.top) / bounds.height) * 2
      );
    }

    renderer.domElement.addEventListener('pointermove', pointerGaze);
    renderer.domElement.addEventListener('pointerdown', (event) => {
      renderer.domElement.setPointerCapture(event.pointerId);
      pointerGaze(event);
    });
    renderer.domElement.addEventListener('pointerup', (event) => {
      renderer.domElement.releasePointerCapture(event.pointerId);
    });

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      const step = 0.25;
      if (!['a', 'd', 'w', 's'].includes(key)) return;
      event.preventDefault();
      if (key === 'a') setGaze(gaze.targetX - step, gaze.targetY);
      if (key === 'd') setGaze(gaze.targetX + step, gaze.targetY);
      if (key === 'w') setGaze(gaze.targetX, gaze.targetY + step);
      if (key === 's') setGaze(gaze.targetX, gaze.targetY - step);
    });

    function resizeScreen() {
      const bounds = screen.getBoundingClientRect();
      const aspect = bounds.width / bounds.height;
      const halfWidth = 3.2;
      const halfHeight = halfWidth / aspect;
      camera.left = -halfWidth;
      camera.right = halfWidth;
      camera.top = halfHeight;
      camera.bottom = -halfHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(bounds.width, bounds.height, false);
    }

    window.addEventListener('resize', resizeScreen);
    resizeScreen();

    function animate() {
      requestAnimationFrame(animate);
      // Advance the clock once per frame. Calling getElapsedTime() and then
      // getDelta() consumed the frame twice, leaving delta effectively zero.
      const delta = Math.min(clock.getDelta(), 0.05);
      const elapsed = clock.elapsedTime;

      gaze.x = THREE.MathUtils.damp(gaze.x, gaze.targetX, 4, delta);
      gaze.y = THREE.MathUtils.damp(gaze.y, gaze.targetY, 4, delta);

      // Core architectural test: the face is pinned at its centre. Gaze is
      // expressed as rotation around that pin, never as translation.
      // The centre pin sits in the upper third of the screen. The sphere
      // still rotates around its own centre, rather than translating during gaze.
      face.position.set(0, parameters.anchor, 0);
      face.rotation.y = gaze.x * THREE.MathUtils.degToRad(parameters.yaw);
      face.rotation.x = -gaze.y * THREE.MathUtils.degToRad(parameters.pitch);

      // Core architectural test: the eyes animate in place on the sphere.
      nextBlink -= delta;
      if (nextBlink <= 0) {
        blink = 1;
        nextBlink = 2.8 + Math.random() * 2.5;
      }
      blink = Math.max(0, blink - delta * 5);
      const blinkScale = 1 - Math.sin(blink * Math.PI) * 0.92;
      leftEye.scale.y = blinkScale;
      rightEye.scale.y = blinkScale;

      // Awake has a small breathing motion, without introducing a new mood state.
      const awakeBreath = 1 + Math.sin(elapsed * 1.8) * 0.018;
      sphere.scale.setScalar(awakeBreath);
      sphereEdges.scale.setScalar(awakeBreath * 1.002);

      document.querySelector('#state').textContent =
        `gaze: ${gaze.x.toFixed(2)}, ${gaze.y.toFixed(2)} | eyes: awake`;
      renderer.render(scene, camera);
    }

    animate();
  </script>
  </div>
</body>
</html>
